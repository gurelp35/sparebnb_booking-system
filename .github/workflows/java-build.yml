name: Java compile and smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile all Java classes
        run: |
          mkdir -p build
          javac -d build *.java
      - name: Run application smoke test
        run: |
          java -cp build Main > output.txt
          grep -q "End of Accommodation List" output.txt
          grep -q "City Center Flat" output.txt
          grep -q "Luxury Villa" output.txt
